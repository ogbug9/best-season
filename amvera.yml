meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt

run:
  # migrate прописан явно: на Amvera миграции не применяются автоматически
  # на первом деплое (см. 05-arhitektura-i-plan.md)
  command: 'sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"'
  containerPort: 8000
  persistenceMount: /data

meta:
  environment: python
build:
  requirementsPath: requirements.txt
run:
  persistenceMount: /data
  containerPort: 8000
  scriptName: sh
  scriptArgs:
    - -c
    # migrate вынесен явно в команду запуска: на Amvera миграции иногда не применяются
    # автоматически на первом деплое (см. 05-arhitektura-i-plan.md)
    - "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

{% load wagtailcore_tags layout_tags %}
    <div class="faq">
      {% for item in faq %}
        <div class="faq__item{% if forloop.counter0|divisibleby:2 %} faq__item--dark{% else %} faq__item--olive{% endif %}{% if forloop.first %} is-open{% endif %}">
          <button type="button" class="faq__question" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="faq-answer-{{ forloop.counter }}"><span class="home-desktop-copy">{% if faq_layout %}{{ item.question|layout_lines:faq_layout|linebreaksbr }}{% else %}{{ item.question }}{% endif %}</span><span class="home-mobile-copy">{% if faq_layout %}{{ item.question }}{% else %}{{ item.question|layout_lines:"faq_mobile"|linebreaksbr }}{% endif %}</span></button>
          <div class="faq__answer" id="faq-answer-{{ forloop.counter }}"{% if not forloop.first %} hidden{% endif %}>{{ item.answer|richtext }}</div>
        </div>
      {% endfor %}
    </div>

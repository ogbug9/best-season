{% load wagtailcore_tags layout_tags %}
    <div class="faq">
      {% for item in faq %}
        <details class="faq__item{% if forloop.counter0|divisibleby:2 %} faq__item--dark{% else %} faq__item--olive{% endif %}">
          <summary class="faq__question"><span class="home-desktop-copy">{{ item.question }}</span><span class="home-mobile-copy">{{ item.question|layout_lines:"faq_mobile"|linebreaksbr }}</span></summary>
          <div class="faq__answer">{{ item.answer|richtext }}</div>
        </details>
      {% endfor %}
    </div>

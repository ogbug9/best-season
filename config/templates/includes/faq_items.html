{% load wagtailcore_tags %}
    <div class="faq">
      {% for item in faq %}
        <details class="faq__item{% if forloop.counter0|divisibleby:2 %} faq__item--dark{% else %} faq__item--olive{% endif %}">
          <summary class="faq__question">{{ item.question }}</summary>
          <div class="faq__answer">{{ item.answer|richtext }}</div>
        </details>
      {% endfor %}
    </div>

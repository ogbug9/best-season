<!-- Набор иконок удобств. Список закрыт в core.models.ICON_CHOICES по п. 9.4 ТЗ:
     редактор выбирает из этих вариантов, произвольные иконки не заводятся.

     Один файл вместо inline-разметки: спрайт кешируется браузером, и страница
     дома с двумя десятками удобств не раздувается повторяющимся SVG.

     Оформление задано атрибутами на самих <symbol>, а не через <style>:
     при обращении к внешнему спрайту через <use> в теневое дерево страницы
     попадает только сам элемент, CSS этого файла с ним не переносится.
     stroke="currentColor" — иконка берёт цвет текста рядом. -->

